# 景点图片代理缓存（避免重复回源到 Flask / 外站）
proxy_cache_path /var/cache/nginx/tm levels=1:2 keys_zone=tm_img:20m max_size=800m inactive=60d use_temp_path=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    # 文本资源压缩，显著减小 JSON / JS / CSS 传输体积
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/xml;

    # 图片内容基本不变，可以长时间缓存
    location /static/images/ {
        alias /opt/travelmate/static/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 其余静态文件（JS/CSS）保持短缓存，避免更新后用户拿到旧文件
    location /static/ {
        alias /opt/travelmate/static/;
        expires -1;
        access_log off;
    }

    # 图片代理：Nginx 侧缓存 30 天，命中后不再回到 Flask
    location /api/attraction-image {
        proxy_cache tm_img;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 行程生成可能需要 10-30 秒
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
