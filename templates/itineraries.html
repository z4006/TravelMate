{% extends "base.html" %}

{% block content %}
<section class="page-head">
    <div class="container">
        <nav class="breadcrumb" aria-label="面包屑导航">
            <a href="{{ url_for('pages.index') }}">首页</a>
            <span aria-hidden="true">/</span>
            <span>已保存的行程</span>
        </nav>
        <h1 class="page-title">已保存的行程</h1>
        <p class="page-desc">这里是你保存下来的行程，可以查看、生成分享文案或删除。</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="result-bar">
            <p class="result-count" data-itinerary-count aria-live="polite"></p>
            <a class="btn btn-ghost btn-sm" href="{{ url_for('pages.agent') }}">去 AI 助手生成行程</a>
        </div>

        <div class="d-list" data-itinerary-list aria-live="polite"></div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/itineraries.js') }}"></script>
{% endblock %}
